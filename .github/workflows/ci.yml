name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-checks:
    name: Frontend Quality Gates (Lint, Format, Typecheck, Test, Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"

      - name: Install dependencies deterministically
        run: npm ci

      - name: Check code formatting (Prettier)
        run: npm run format:check

      - name: Lint code (ESLint)
        run: npm run lint

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Run unit & invariant tests (Vitest)
        run: npm run test

      - name: Build production web bundle
        run: npm run build

  e2e-tests:
    name: E2E Smoke Tests (Playwright Chromium)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"

      - name: Install dependencies deterministically
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: npm run test:e2e

      - name: Upload Playwright failure report & traces
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  desktop-windows-build:
    name: Windows Desktop Tauri Compilation
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy

      - name: Install dependencies deterministically
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Run Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Run Rust Clippy checks
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Check Tauri Rust compilation
        run: cargo check --manifest-path src-tauri/Cargo.toml --release
