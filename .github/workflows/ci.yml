name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-checks:
    name: Frontend Quality Gates (Lint, Format, Typecheck, Test, Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"

      - name: Install dependencies deterministically
        run: npm ci

      - name: Check code formatting (Prettier)
        run: npm run format:check

      - name: Lint code (ESLint)
        run: npm run lint

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Run unit & invariant tests (Vitest)
        run: npm run test

      - name: Build production web bundle
        run: npm run build

  e2e-tests:
    name: E2E Smoke Tests (Playwright Chromium)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"

      - name: Install dependencies deterministically
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: npm run test:e2e

      - name: Upload Playwright failure report & traces
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  desktop-windows-build:
    name: Windows Desktop Tauri Compilation
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy

      - name: Install dependencies deterministically
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Run Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Run Rust Clippy checks
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Check Tauri Rust compilation
        run: cargo check --manifest-path src-tauri/Cargo.toml --release

      - name: Build and package Windows Desktop installers
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          SIGNTOOL_TIMESTAMP_SERVER: "http://timestamp.digicert.com"
        shell: pwsh
        run: |
          Write-Host "Compiling Windows packages..."
          npm run tauri:build

          # Check if code signing secrets are configured
          if ($env:WINDOWS_CERTIFICATE_BASE64 -and $env:WINDOWS_CERTIFICATE_PASSWORD) {
            Write-Host "Code signing credentials detected. Executing secure Authenticode signing..."
            $certPath = "$env:TEMP\chessforge_signing_cert.pfx"
            try {
              $certBytes = [System.Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
              [System.IO.File]::WriteAllBytes($certPath, $certBytes)

              # Discover and sign generated setup packages
              $bundleFiles = Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -Include *.exe,*.msi
              foreach ($file in $bundleFiles) {
                Write-Host "Signing release artifact: $($file.FullName)"
                & signtool sign /f $certPath /p $env:WINDOWS_CERTIFICATE_PASSWORD /tr $env:SIGNTOOL_TIMESTAMP_SERVER /td sha256 /fd sha256 $file.FullName
              }
            }
            finally {
              if (Test-Path $certPath) {
                Remove-Item -Force $certPath
                Write-Host "Securely deleted temporary signing certificate from runner."
              }
            }
          } else {
            Write-Host "No code signing credentials provided. Proceeding with unsigned development package verification."
          }

      - name: Generate SHA-256 Artifact Checksums
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -Include *.exe,*.msi
          if ($artifacts.Count -gt 0) {
            $checksumFile = "src-tauri/target/release/bundle/checksums.txt"
            "" | Out-File -FilePath $checksumFile -Encoding utf8
            foreach ($item in $artifacts) {
              $hash = (Get-FileHash -Path $item.FullName -Algorithm SHA256).Hash.ToLower()
              "$hash  $($item.Name)" | Out-File -FilePath $checksumFile -Append -Encoding utf8
            }
            Write-Host "Generated SHA-256 checksums:"
            Get-Content $checksumFile
          }
